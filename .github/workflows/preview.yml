# Publish each pull request at its own Pages URL.
#
# Build the tree in this workspace only: the current main root, plus this pull
# request's files under pr-preview/pr-<number>/. Upload that tree and deploy it
# with the Pages actions. Never commit or push to main.
# .github/workflows/static.yml remains the live deploy for pushes to main.
name: Preview pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Build combined Pages tree
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          rm -rf _site
          mkdir -p _site
          git archive origin/main | tar -x -C _site
          rm -rf "_site/pr-preview/pr-${PR_NUMBER}"
          mkdir -p "_site/pr-preview/pr-${PR_NUMBER}"
          git archive HEAD | tar -x -C "_site/pr-preview/pr-${PR_NUMBER}"
          test ! -e _site/.git
          echo "Combined tree:"
          find _site -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://srayman.github.io/soccer-strategy/pr-preview/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  comment:
    needs: deploy
    if: always() && github.event.pull_request.head.repo.full_name == github.repository && (needs.deploy.result == 'success' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Post the preview result
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PREVIEW_URL: https://srayman.github.io/soccer-strategy/pr-preview/pr-${{ github.event.pull_request.number }}/
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          marker="<!-- soccer-strategy-preview -->"
          if [ "$DEPLOY_RESULT" = "success" ]; then
            printf '%s\nPreview: %s\n' "$marker" "$PREVIEW_URL" > /tmp/preview-comment.txt
          else
            job_json="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs")"
            check_path="$(printf '%s' "$job_json" | jq -r '.jobs[] | select(.name=="deploy") | .check_run_url' | sed 's#^https://api.github.com/##')"
            annotations="$(gh api "${check_path}/annotations" --jq '.[].message' 2>/dev/null || true)"
            step_count="$(printf '%s' "$job_json" | jq -r '.jobs[] | select(.name=="deploy") | (.steps // []) | length')"
            if printf '%s\n' "$annotations" | grep -Eiq 'not allowed to deploy|environment protection|protection rule|branch policy|only allows'; then
              rejected=1
            elif [ "$step_count" = "0" ]; then
              rejected=1
            else
              rejected=0
            fi
            if [ "$rejected" = "1" ]; then
              {
                printf '%s\n' "$marker"
                printf '%s\n' "The github-pages environment rejected this preview deployment because it does not come from main."
                if [ -n "$annotations" ]; then
                  printf '\n%s\n' "$annotations"
                fi
                printf '\n%s\n' "Stopping. This workflow does not commit or push to main."
              } > /tmp/preview-comment.txt
            else
              {
                printf '%s\n' "$marker"
                printf '%s\n' "Preview deployment failed."
                if [ -n "$annotations" ]; then
                  printf '\n%s\n' "$annotations"
                fi
              } > /tmp/preview-comment.txt
            fi
          fi

          existing="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" --jq "[.[] | select((.body // \"\") | contains(\"${marker}\"))][0].id // empty")"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -f body="$(cat /tmp/preview-comment.txt)"
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$(cat /tmp/preview-comment.txt)"
          fi
